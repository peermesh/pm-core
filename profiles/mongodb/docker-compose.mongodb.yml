# Root-canonical service definition; generated with retained optional consumers.
# Relative paths are based at this standalone fragment directory.
{
  "services": {
    "mongodb": {
      "cap_add": [
        "CHOWN",
        "DAC_OVERRIDE",
        "FOWNER",
        "SETGID",
        "SETUID"
      ],
      "cap_drop": [
        "ALL"
      ],
      "command": [
        "--wiredTigerCacheSizeGB",
        "${MONGODB_CACHE_SIZE_GB:-0.25}"
      ],
      "container_name": "pmdl_mongodb",
      "deploy": {
        "resources": {
          "limits": {
            "memory": "${MONGODB_MEMORY_LIMIT:-1G}"
          },
          "reservations": {
            "memory": "${MONGODB_MEMORY_RESERVATION:-512M}"
          }
        }
      },
      "environment": {
        "MONGO_INITDB_ROOT_PASSWORD_FILE": "/run/secrets/mongodb_root_password",
        "MONGO_INITDB_ROOT_USERNAME": "root"
      },
      "healthcheck": {
        "interval": "30s",
        "retries": 5,
        "start_period": "120s",
        "test": [
          "CMD",
          "mongosh",
          "--eval",
          "db.adminCommand('ping')"
        ],
        "timeout": "10s"
      },
      "image": "mongo@sha256:03cda579c8caad6573cb98c2b3d5ff5ead452a6450561129b89595b4b9c18de2",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "networks": {
        "db-internal": null
      },
      "profiles": [
        "mongodb"
      ],
      "read_only": true,
      "restart": "unless-stopped",
      "secrets": [
        {
          "source": "mongodb_root_password",
          "target": "/run/secrets/mongodb_root_password"
        }
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "tmpfs": [
        "/tmp:size=64m"
      ],
      "volumes": [
        {
          "source": "pmdl_mongodb_data",
          "target": "/data/db",
          "type": "volume",
          "volume": {}
        },
        {
          "bind": {
            "create_host_path": true
          },
          "read_only": true,
          "source": "init-scripts",
          "target": "/docker-entrypoint-initdb.d",
          "type": "bind"
        }
      ]
    }
  },
  "networks": {
    "db-internal": {
      "internal": true,
      "name": "pmdl_db-internal"
    }
  },
  "volumes": {
    "pmdl_mongodb_data": {
      "driver": "local"
    }
  },
  "secrets": {
    "mongodb_root_password": {
      "file": "../../secrets/mongodb_root_password"
    }
  },
  "configs": {}
}
