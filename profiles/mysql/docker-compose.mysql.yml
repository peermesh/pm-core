# Root-canonical service definition; generated with retained optional consumers.
# Relative paths are based at this standalone fragment directory.
{
  "services": {
    "mysql": {
      "cap_add": [
        "CHOWN",
        "DAC_OVERRIDE",
        "FOWNER",
        "SETGID",
        "SETUID"
      ],
      "cap_drop": [
        "ALL"
      ],
      "command": [
        "--innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_SIZE:-256M}",
        "--max-connections=${MYSQL_MAX_CONNECTIONS:-100}"
      ],
      "container_name": "pmdl_mysql",
      "deploy": {
        "resources": {
          "limits": {
            "memory": "${MYSQL_MEMORY_LIMIT:-1G}"
          },
          "reservations": {
            "memory": "${MYSQL_MEMORY_RESERVATION:-512M}"
          }
        }
      },
      "environment": {
        "MYSQL_ROOT_PASSWORD_FILE": "/run/secrets/mysql_root_password"
      },
      "healthcheck": {
        "interval": "30s",
        "retries": 5,
        "start_period": "120s",
        "test": [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost"
        ],
        "timeout": "10s"
      },
      "image": "mysql@sha256:64756cc92f707eb504496d774353990bcb0f6999ddf598b6ad188f2da66bd000",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "networks": {
        "db-internal": null
      },
      "profiles": [
        "mysql"
      ],
      "read_only": true,
      "restart": "unless-stopped",
      "secrets": [
        {
          "source": "mysql_root_password",
          "target": "/run/secrets/mysql_root_password"
        }
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "tmpfs": [
        "/tmp:size=64m",
        "/run/mysqld:size=16m"
      ],
      "volumes": [
        {
          "source": "pmdl_mysql_data",
          "target": "/var/lib/mysql",
          "type": "volume",
          "volume": {}
        },
        {
          "bind": {
            "create_host_path": true
          },
          "read_only": true,
          "source": "init-scripts",
          "target": "/docker-entrypoint-initdb.d",
          "type": "bind"
        }
      ]
    }
  },
  "networks": {
    "db-internal": {
      "internal": true,
      "name": "pmdl_db-internal"
    }
  },
  "volumes": {
    "pmdl_mysql_data": {
      "driver": "local"
    }
  },
  "secrets": {
    "mysql_root_password": {
      "file": "../../secrets/mysql_root_password"
    }
  },
  "configs": {}
}
