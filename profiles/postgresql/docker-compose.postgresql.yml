# Root-canonical service definition; generated with retained optional consumers.
# Relative paths are based at this standalone fragment directory.
{
  "services": {
    "postgres": {
      "cap_add": [
        "CHOWN",
        "DAC_OVERRIDE",
        "FOWNER",
        "SETGID",
        "SETUID"
      ],
      "cap_drop": [
        "ALL"
      ],
      "command": [
        "postgres",
        "-c",
        "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}",
        "-c",
        "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE:-768MB}",
        "-c",
        "work_mem=${POSTGRES_WORK_MEM:-4MB}",
        "-c",
        "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}",
        "-c",
        "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}",
        "-c",
        "random_page_cost=1.1",
        "-c",
        "effective_io_concurrency=200"
      ],
      "container_name": "pmdl_postgres",
      "deploy": {
        "resources": {
          "limits": {
            "memory": "${POSTGRES_MEMORY_LIMIT:-1G}"
          },
          "reservations": {
            "memory": "${POSTGRES_MEMORY_RESERVATION:-512M}"
          }
        }
      },
      "environment": {
        "POSTGRES_DB": "postgres",
        "POSTGRES_INITDB_ARGS": "--encoding=UTF8",
        "POSTGRES_PASSWORD_FILE": "/run/secrets/postgres_password",
        "POSTGRES_USER": "postgres"
      },
      "healthcheck": {
        "interval": "30s",
        "retries": 5,
        "start_period": "120s",
        "test": [
          "CMD-SHELL",
          "pg_isready -U postgres -d postgres"
        ],
        "timeout": "10s"
      },
      "image": "pgvector/pgvector@sha256:7d400e340efb42f4d8c9c12c6427adb253f726881a9985d2a471bf0eed824dff",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "networks": {
        "db-internal": null
      },
      "profiles": [
        "postgresql"
      ],
      "read_only": true,
      "restart": "unless-stopped",
      "secrets": [
        {
          "source": "postgres_password",
          "target": "/run/secrets/postgres_password"
        }
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "shm_size": "256mb",
      "tmpfs": [
        "/tmp:size=64m",
        "/run/postgresql:size=16m"
      ],
      "volumes": [
        {
          "source": "pmdl_postgres_data",
          "target": "/var/lib/postgresql/data",
          "type": "volume",
          "volume": {}
        },
        {
          "bind": {
            "create_host_path": true
          },
          "read_only": true,
          "source": "init-scripts",
          "target": "/docker-entrypoint-initdb.d",
          "type": "bind"
        }
      ]
    }
  },
  "networks": {
    "db-internal": {
      "internal": true,
      "name": "pmdl_db-internal"
    }
  },
  "volumes": {
    "pmdl_postgres_data": {
      "driver": "local"
    }
  },
  "secrets": {
    "postgres_password": {
      "file": "../../secrets/postgres_password"
    }
  },
  "configs": {}
}
