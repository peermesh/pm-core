# Root-canonical service definition; generated with retained optional consumers.
# Relative paths are based at this standalone fragment directory.
{
  "services": {
    "minio": {
      "cap_drop": [
        "ALL"
      ],
      "command": "server /data --console-address \":9001\"",
      "container_name": "pmdl_minio",
      "deploy": {
        "resources": {
          "limits": {
            "memory": "${MINIO_MEMORY_LIMIT:-512M}"
          },
          "reservations": {
            "memory": "${MINIO_MEMORY_RESERVATION:-128M}"
          }
        }
      },
      "environment": {
        "MINIO_ROOT_PASSWORD_FILE": "/run/secrets/minio_root_password",
        "MINIO_ROOT_USER_FILE": "/run/secrets/minio_root_user"
      },
      "healthcheck": {
        "interval": "30s",
        "retries": 5,
        "start_period": "30s",
        "test": [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ],
        "timeout": "10s"
      },
      "image": "minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e",
      "labels": [
        "traefik.enable=true",
        "traefik.http.routers.minio-api.rule=Host(`s3.${DOMAIN}`)",
        "traefik.http.routers.minio-api.entrypoints=websecure",
        "traefik.http.routers.minio-api.tls.certresolver=letsencrypt",
        "traefik.http.routers.minio-api.service=minio-api",
        "traefik.http.services.minio-api.loadbalancer.server.port=9000",
        "traefik.http.routers.minio-console.rule=Host(`minio.${DOMAIN}`)",
        "traefik.http.routers.minio-console.entrypoints=websecure",
        "traefik.http.routers.minio-console.tls.certresolver=letsencrypt",
        "traefik.http.routers.minio-console.service=minio-console",
        "traefik.http.services.minio-console.loadbalancer.server.port=9001"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "networks": {
        "app-internal": null,
        "proxy-external": null
      },
      "profiles": [
        "minio"
      ],
      "restart": "unless-stopped",
      "secrets": [
        {
          "source": "minio_root_user",
          "target": "/run/secrets/minio_root_user"
        },
        {
          "source": "minio_root_password",
          "target": "/run/secrets/minio_root_password"
        }
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "source": "pmdl_minio_data",
          "target": "/data",
          "type": "volume",
          "volume": {}
        }
      ]
    }
  },
  "networks": {
    "app-internal": {
      "internal": true,
      "name": "pmdl_app-internal"
    },
    "proxy-external": {
      "name": "pmdl_proxy-external"
    }
  },
  "volumes": {
    "pmdl_minio_data": {
      "driver": "local"
    }
  },
  "secrets": {
    "minio_root_password": {
      "file": "../../secrets/minio_root_password"
    },
    "minio_root_user": {
      "file": "../../secrets/minio_root_user"
    }
  },
  "configs": {}
}
