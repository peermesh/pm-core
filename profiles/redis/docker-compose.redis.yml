# Root-canonical service definition; generated with retained optional consumers.
# Relative paths are based at this standalone fragment directory.
{
  "services": {
    "redis": {
      "cap_drop": [
        "ALL"
      ],
      "command": [
        "/bin/sh",
        "-ec",
        "REDIS_PASSWORD=\"$$(cat /run/secrets/redis_password)\"\nexec redis-server \\\n  --maxmemory ${REDIS_MAXMEMORY:-128mb} \\\n  --maxmemory-policy allkeys-lru \\\n  --appendonly yes \\\n  --requirepass \"$$REDIS_PASSWORD\"\n"
      ],
      "container_name": "pmdl_redis",
      "deploy": {
        "resources": {
          "limits": {
            "memory": "${REDIS_MEMORY_LIMIT:-256M}"
          },
          "reservations": {
            "memory": "${REDIS_MEMORY_RESERVATION:-64M}"
          }
        }
      },
      "healthcheck": {
        "interval": "30s",
        "retries": 5,
        "start_period": "30s",
        "test": [
          "CMD-SHELL",
          "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping"
        ],
        "timeout": "10s"
      },
      "image": "redis@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "networks": {
        "app-internal": null
      },
      "profiles": [
        "redis"
      ],
      "read_only": true,
      "restart": "unless-stopped",
      "secrets": [
        {
          "mode": 292,
          "source": "redis_password",
          "target": "/run/secrets/redis_password"
        }
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "tmpfs": [
        "/tmp:size=32m"
      ],
      "user": "999:999",
      "volumes": [
        {
          "source": "pmdl_redis_data",
          "target": "/data",
          "type": "volume",
          "volume": {}
        }
      ]
    },
    "redis-exporter": {
      "container_name": "pmdl_redis_exporter",
      "depends_on": {
        "redis": {
          "condition": "service_healthy",
          "required": true
        }
      },
      "environment": {
        "REDIS_ADDR": "redis:6379",
        "REDIS_PASSWORD_FILE": "/run/secrets/redis_password"
      },
      "image": "oliver006/redis_exporter@sha256:6a97d4dd743b533e1f950c677b87d880e44df363c61af3f406fc9e53ed65ee03",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "2",
          "max-size": "5m"
        }
      },
      "networks": {
        "app-internal": null,
        "monitoring": null
      },
      "ports": [
        "127.0.0.1:${REDIS_EXPORTER_HOST_PORT:-19121}:9121"
      ],
      "profiles": [
        "monitoring",
        "full"
      ],
      "restart": "unless-stopped",
      "secrets": [
        {
          "source": "redis_password",
          "target": "/run/secrets/redis_password"
        }
      ]
    },
    "redis-ephemeral": {
      "command": [
        "redis-server",
        "--protected-mode",
        "no",
        "--maxmemory",
        "400mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--save",
        "",
        "--appendonly",
        "no",
        "--tcp-keepalive",
        "60"
      ],
      "container_name": "pmdl_redis_ephemeral",
      "deploy": {
        "resources": {
          "limits": {
            "memory": "512M"
          },
          "reservations": {
            "memory": "256M"
          }
        }
      },
      "healthcheck": {
        "interval": "10s",
        "retries": 3,
        "start_period": "5s",
        "test": [
          "CMD",
          "redis-cli",
          "ping"
        ],
        "timeout": "3s"
      },
      "image": "redis@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "networks": {
        "app-internal": null
      },
      "profiles": [
        "ephemeral-cache",
        "lite"
      ],
      "restart": "unless-stopped",
      "tmpfs": [
        "/data:size=512M,mode=1777"
      ]
    }
  },
  "networks": {
    "app-internal": {
      "internal": true,
      "name": "pmdl_app-internal"
    },
    "monitoring": {
      "name": "pmdl_monitoring"
    }
  },
  "volumes": {
    "pmdl_redis_data": {
      "driver": "local"
    }
  },
  "secrets": {
    "redis_password": {
      "file": "../../secrets/redis_password"
    }
  },
  "configs": {}
}
